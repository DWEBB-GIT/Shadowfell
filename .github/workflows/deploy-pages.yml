name: Build and Deploy Pages

# Exports the Godot game (preset "Web", single-threaded) on every push to main
# and publishes it to GitHub Pages, so the live game always matches the source.
# data/build.json carries the commit and build time shown on the title screen.
# Needs Settings > Pages > Build and deployment > Source = "GitHub Actions".

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Godot and web export templates
        run: |
          V=4.7-stable
          URL=https://github.com/godotengine/godot/releases/download/$V
          curl -sSLo godot.zip $URL/Godot_v${V}_linux.x86_64.zip
          unzip -q godot.zip && mv Godot_v${V}_linux.x86_64 godot
          curl -sSLo templates.tpz $URL/Godot_v${V}_export_templates.tpz
          T=~/.local/share/godot/export_templates/${V/-/.}
          mkdir -p $T
          unzip -q -j templates.tpz 'templates/web_nothreads_*' 'templates/version.txt' -d $T
          rm godot.zip templates.tpz

      - name: Stamp build version
        run: |
          echo "{\"commit\": \"${GITHUB_SHA::7}\", \"time\": \"$(date -u +'%Y-%m-%d %H:%M') UTC\"}" > data/build.json

      - name: Export Godot web build
        run: |
          mkdir -p _site
          ./godot --headless --path . --import || true
          ./godot --headless --path . --export-release "Web" _site/index.html
          test -f _site/index.wasm

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
