name: Build and Deploy Pages

# Builds the bundle from source on every push to main and publishes the playable
# site (index.html, style.css, dist/) to GitHub Pages. Building here means the
# live game always matches the source, even if a commit forgot to rebuild dist.
# Needs Settings > Pages > Build and deployment > Source = "GitHub Actions".

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate data
        run: npm run validate

      - name: Build
        run: npm run build

      - name: Assemble site
        run: |
          mkdir -p _site/dist
          cp index.html style.css _site/
          cp dist/shadowfall.js _site/dist/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
