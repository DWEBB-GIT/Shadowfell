<svg xmlns="http://www.w3.org/2000/svg" width="940" height="660" viewBox="0 0 940 660" role="img" aria-labelledby="title description">
  <title id="title">Shadowfell: proposed compact district</title>
  <desc id="description">A proposed town-to-shrine route through a ford and watch ruins, with a side loop through a camp and forest clearing. Schematic only; this is not the existing terrain.</desc>
  <rect width="940" height="660" fill="#19211e"/>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#ece7d8">
    <text x="40" y="37" font-size="22" font-weight="600">A readable district, one route at a time</text>
    <text x="40" y="61" font-size="14" fill="#b8c2b5">Proposed layout · 350 × 500 m target area · schematic, not existing terrain</text>
    <rect x="45" y="83" width="440" height="535" rx="14" fill="#2d3c30" stroke="#697663"/>
    <path d="M70 105 L128 115 L158 180 L136 240 L166 286 L137 364 L155 418 L114 464 L147 520 L109 594 L65 592 Z" fill="#1c2f23"/>
    <path d="M382 98 L462 104 L462 589 L395 593 L365 528 L395 471 L372 410 L402 340 L376 283 L404 211 Z" fill="#3c443c"/>
    <path d="M47 386 C150 369 180 424 273 403 S381 353 485 371" fill="none" stroke="#587f8b" stroke-width="18"/>
    <path d="M47 386 C150 369 180 424 273 403 S381 353 485 371" fill="none" stroke="#8aafb2" stroke-width="2"/>
    <path d="M282 563 C290 518 252 474 259 409 S296 326 281 265 S242 187 246 126" fill="none" stroke="#ccb77d" stroke-width="10" stroke-linecap="round"/>
    <path d="M281 548 C234 537 190 528 166 487 S142 392 165 337 S218 281 279 263" fill="none" stroke="#9eaa7a" stroke-width="6" stroke-linecap="round" stroke-dasharray="10 7"/>
    <ellipse cx="281" cy="265" rx="46" ry="35" fill="#bf9356" fill-opacity=".3" stroke="#d5b679"/>
    <ellipse cx="165" cy="337" rx="35" ry="28" fill="#bf9356" fill-opacity=".25" stroke="#b8b785"/>
    <g fill="#e1d6b4" stroke="#1a211e" stroke-width="3">
      <rect x="262" y="547" width="38" height="28" rx="3"/>
      <rect x="248" y="393" width="23" height="28" rx="2"/>
      <rect x="270" y="247" width="22" height="29" rx="2"/>
      <path d="M246 105 L260 130 L232 130 Z"/>
      <circle cx="166" cy="487" r="10"/>
    </g>
    <g font-size="15" font-weight="600">
      <text x="307" y="567">Town gate</text>
      <text x="281" y="414">Ford</text>
      <text x="305" y="262">Watch ruins</text>
      <text x="270" y="124">Hill shrine</text>
      <text x="78" y="514">Camp</text>
      <text x="76" y="300">Forest clearing</text>
    </g>
    <g font-size="13" fill="#c1cbb9">
      <text x="303" y="588">Hub and route choice</text>
      <text x="305" y="284">Encounter arena</text>
      <text x="80" y="320">Optional encounter</text>
      <text x="89" y="155" transform="rotate(-90 89 155)">N ↑</text>
    </g>
    <g transform="translate(535 117)">
      <text font-size="18" font-weight="600">What makes the route readable</text>
      <path d="M0 38 H45" stroke="#ccb77d" stroke-width="8" stroke-linecap="round"/>
      <text x="61" y="43" font-size="15">Main route: 8–14 m wide</text>
      <path d="M0 76 H45" stroke="#9eaa7a" stroke-width="5" stroke-dasharray="9 6"/>
      <text x="61" y="81" font-size="15">Side route: returns in a loop</text>
      <ellipse cx="23" cy="115" rx="24" ry="15" fill="#bf9356" fill-opacity=".35" stroke="#d5b679"/>
      <text x="61" y="121" font-size="15">Arenas: 25–40 m across</text>
      <text x="0" y="183" font-size="16" font-weight="600">A cue every 20–35 m</text>
      <text x="0" y="210" font-size="14" fill="#c1cbb9">A bend, rock, lamp, bridge or ruin</text>
      <text x="0" y="232" font-size="14" fill="#c1cbb9">shows where the route continues.</text>
      <text x="0" y="286" font-size="16" font-weight="600">Open for encounters; narrow at exits</text>
      <text x="0" y="313" font-size="14" fill="#c1cbb9">Forest belts, rocks and slopes frame</text>
      <text x="0" y="335" font-size="14" fill="#c1cbb9">the route and supply recognisable edges.</text>
      <text x="0" y="389" font-size="16" font-weight="600">Camera supports the layout</text>
      <text x="0" y="416" font-size="14" fill="#c1cbb9">Stable combat view; deliberate zoom</text>
      <text x="0" y="438" font-size="14" fill="#c1cbb9">and temporary look ahead for exploration.</text>
    </g>
  </g>
</svg>
